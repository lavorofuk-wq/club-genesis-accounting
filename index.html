<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUB GENESIS 経理システム ログイン</title>
  <meta name="theme-color" content="#111827">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen grid place-items-center px-4">
    <section class="auth-panel w-full max-w-md">
      <div class="mb-8 text-center">
        <p class="text-sm tracking-[0.28em] text-amber-300">CLUB GENESIS</p>
        <h1 class="mt-3 text-3xl font-bold">経理システム</h1>
        <p class="mt-2 text-sm text-slate-400">Ver1.3.4</p>
      </div>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="email" class="form-label">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="form-input" placeholder="shop@example.com">
        </div>
        <div>
          <label for="password" class="form-label">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input" placeholder="8文字以上">
        </div>
        <div id="errorMessage" class="hidden alert alert-error"></div>
        <button id="loginButton" type="submit" class="primary-button w-full">ログイン</button>
      </form>
    </section>
  </main>

  <script>
    if (location.protocol === "file:") {
      document.body.innerHTML = `
        <main class="min-h-screen grid place-items-center px-4">
          <section class="auth-panel w-full max-w-lg">
            <p class="text-sm tracking-[0.24em] text-amber-300">CLUB GENESIS</p>
            <h1 class="mt-3 text-2xl font-bold">この開き方ではログインできません</h1>
            <p class="mt-5 leading-7 text-slate-300">
              index.htmlを直接開くと、ブラウザがFirebaseのログイン処理を止めます。
              この画面を閉じて、フォルダ内の「起動.bat」をダブルクリックしてください。
            </p>
          </section>
        </main>`;
    } else {
      const script = document.createElement("script");
      script.type = "module";
      script.src = "js/auth.js";
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
