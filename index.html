<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENESIS Management System ログイン</title>
  <meta name="theme-color" content="#f5f7fb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen">
  <main class="grid min-h-screen place-items-center px-4">
    <section class="auth-panel w-full max-w-md">
      <div class="mb-8 text-center">
        <p class="brand-kicker">CLUB GENESIS</p>
        <h1 class="mt-3 text-3xl font-bold text-slate-900">GENESIS Management System</h1>
        <p class="mt-2 text-sm font-semibold text-slate-500">GMS</p>
        <div class="mt-3 flex items-center justify-center gap-2">
          <span class="text-sm text-slate-500">Ver1.44</span>
          <span id="environmentBadge" class="env-badge"></span>
        </div>
      </div>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="email" class="form-label">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="form-input" placeholder="shop@example.com">
        </div>
        <div>
          <label for="password" class="form-label">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input" placeholder="8文字以上">
        </div>
        <div id="errorMessage" class="hidden alert alert-error"></div>
        <button id="loginButton" type="submit" class="primary-button w-full">ログイン</button>
      </form>
    </section>
  </main>

  <script>
    if (location.protocol === "file:") {
      document.body.innerHTML = `
        <main class="grid min-h-screen place-items-center px-4">
          <section class="auth-panel w-full max-w-lg">
            <p class="brand-kicker">CLUB GENESIS</p>
            <h1 class="mt-3 text-2xl font-bold text-slate-900">この開き方ではログインできません</h1>
            <p class="mt-5 leading-7 text-slate-600">
              index.htmlを直接開くと、ブラウザがFirebaseのログイン処理を止めます。
              フォルダ内の「起動.bat」をダブルクリックして、表示されたURLから開いてください。
            </p>
          </section>
        </main>`;
    } else {
      const script = document.createElement("script");
      script.type = "module";
      script.src = "js/auth.js";
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
