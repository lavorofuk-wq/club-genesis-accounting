<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMS 店舗作業フォーム</title>
  <meta name="theme-color" content="#f5f7fb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen">
  <header class="app-header">
    <div>
      <p class="brand-kicker">GMS</p>
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold text-slate-900">店舗作業フォーム</h1>
        <span id="environmentBadge" class="env-badge"></span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="userEmail" class="hidden text-xs text-slate-500 sm:inline"></span>
      <button id="logoutButton" class="secondary-button">ログアウト</button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <div id="authLoading" class="notice">認証情報を確認しています...</div>
    <form id="reportForm" class="hidden space-y-6" novalidate>
      <section class="section-shell">
        <div class="section-title">
          <div>
            <h2>POS締め確認</h2>
            <p class="mt-1 text-sm text-slate-500">POSから届いた締めデータを確認し、必要なら訂正してから経理側へ送信します。</p>
          </div>
          <button id="reloadPendingButton" type="button" class="secondary-button">再読込</button>
        </div>
        <div id="pendingClosings" class="pending-list"></div>
      </section>

      <section class="section-shell">
        <div class="section-title">
          <div>
            <h2>スタッフ管理</h2>
            <p class="mt-1 text-sm text-slate-500">スタッフの入店情報を登録し、退店時は在籍状態を変更します。</p>
          </div>
        </div>
        <div class="staff-registration-grid">
          <label>
            <span class="form-label">名前</span>
            <input id="newStaffName" type="text" maxlength="40" class="form-input" placeholder="スタッフ名">
          </label>
          <label>
            <span class="form-label">雇用形態</span>
            <select id="newStaffEmploymentType" class="form-select">
              <option value="employee">社員</option>
              <option value="partTime">アルバイト</option>
            </select>
          </label>
          <label>
            <span class="form-label">業務区分</span>
            <select id="newStaffJobType" class="form-select">
              <option value="kitchen">キッチンスタッフ</option>
              <option value="hall">ホールスタッフ</option>
              <option value="driver">ドライバースタッフ</option>
            </select>
          </label>
          <label>
            <span class="form-label">給与形態</span>
            <select id="newStaffPayType" class="form-select">
              <option value="daily">日給</option>
              <option value="hourly">時給</option>
            </select>
          </label>
          <label>
            <span class="form-label">給与金額（円）</span>
            <input id="newStaffPayAmount" type="number" min="1" step="1" class="form-input" placeholder="例：1200">
          </label>
          <div class="flex items-end gap-2">
            <button id="registerStaffButton" type="button" class="primary-button flex-1">入店登録</button>
            <button id="cancelStaffEditButton" type="button" class="secondary-button hidden">取消</button>
          </div>
        </div>
        <div id="staffMasterList" class="master-list mt-5"></div>
      </section>

      <section class="section-shell">
        <div class="section-title">
          <div>
            <h2>キャスト管理</h2>
            <p class="mt-1 text-sm text-slate-500">キャスト登録は次の仕様確定後に拡張します。</p>
          </div>
        </div>
        <div class="master-panel">
          <div class="grid gap-3 sm:grid-cols-[1fr_auto]">
            <input id="newCastName" type="text" maxlength="40" class="form-input" placeholder="キャスト名">
            <button id="registerCastButton" type="button" class="primary-button">登録</button>
          </div>
          <div id="castMasterList" class="master-list mt-4"></div>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title">
          <h2>営業日</h2>
          <button id="copyPreviousButton" type="button" class="secondary-button">前日のデータをコピー</button>
        </div>
        <div class="grid gap-4 md:grid-cols-3">
          <div>
            <label for="date" class="form-label">日付</label>
            <input id="date" type="date" required class="form-input">
          </div>
          <div class="md:col-span-2">
            <div id="warningBanner" class="hidden alert alert-warning"></div>
            <div id="errorMessage" class="hidden alert alert-error"></div>
            <div id="successMessage" class="hidden alert alert-success"></div>
          </div>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title"><h2>勤務時間</h2></div>
        <div>
          <h3 class="text-sm font-bold text-slate-800">スタッフ勤務時間</h3>
          <p class="mt-1 text-sm text-slate-500">当日の出勤者を選択し、開始・終了時刻を15分単位で入力してください。日付をまたぐ勤務にも対応します。</p>
          <div id="staffAttendancePicker" class="attendance-picker mt-4"></div>
          <div id="staffWorkRows" class="mt-4 space-y-3"></div>
        </div>
        <div class="mt-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="text-sm font-bold text-slate-800">キャスト勤務時間</h3>
            <button id="addCastWorkButton" type="button" class="secondary-button">キャスト追加</button>
          </div>
          <div id="castWorkRows" class="mt-3 space-y-3"></div>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title"><h2>売上</h2></div>
        <div class="grid gap-4 md:grid-cols-3">
          <label class="field-card">総売上（円）<input id="totalSales" type="number" min="0" step="1" value="0" class="form-input mt-2 money-input"></label>
          <label class="field-card">現金会計売上（円）<input id="cashSales" type="number" min="0" step="1" value="0" class="form-input mt-2 money-input"></label>
          <label class="field-card">カード会計売上（円）<input id="cardSales" type="number" min="0" step="1" value="0" class="form-input mt-2 money-input"></label>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title"><h2>客数情報</h2></div>
        <div class="grid gap-4 md:grid-cols-3">
          <label class="field-card">来店組数<input id="groupCount" type="number" min="0" step="1" value="0" class="form-input mt-2"></label>
          <label class="field-card">総客数<input id="totalCustomers" type="number" min="0" step="1" value="0" class="form-input mt-2"></label>
          <label class="field-card">客単価（自動計算）<input id="customerUnitPrice" type="text" readonly class="form-input mt-2 readonly-input" value="0"></label>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title"><h2>指名情報</h2></div>
        <div class="grid gap-4 md:grid-cols-2">
          <label class="field-card">本指名（件数）<input id="honShimei" type="number" min="0" step="1" value="0" class="form-input mt-2"></label>
          <label class="field-card">場内指名（件数）<input id="jonai" type="number" min="0" step="1" value="0" class="form-input mt-2"></label>
        </div>
      </section>

      <section class="section-shell">
        <div class="section-title">
          <h2>経費</h2>
          <button id="addExpenseButton" type="button" class="secondary-button">経費追加</button>
        </div>
        <div id="expenseRows" class="space-y-3"></div>
      </section>

      <section class="section-shell">
        <div class="section-title">
          <h2>手当</h2>
          <button id="addAllowanceButton" type="button" class="secondary-button">手当追加</button>
        </div>
        <div id="allowanceRows" class="space-y-3"></div>
      </section>

      <div class="sticky bottom-0 -mx-4 border-t border-slate-200 bg-white/95 px-4 py-4 backdrop-blur">
        <button id="saveButton" type="button" class="primary-button w-full md:w-auto">経理へ送信する</button>
      </div>
    </form>
  </main>

  <dialog id="confirmModal" class="modal-card">
    <form method="dialog">
      <h2 class="text-xl font-bold">経理送信前の確認</h2>
      <div id="confirmSummary" class="mt-4 space-y-2 text-sm text-slate-600"></div>
      <div class="mt-6 flex justify-end gap-3">
        <button value="cancel" class="secondary-button">戻る</button>
        <button id="confirmSaveButton" value="save" class="primary-button">経理へ送信</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/shop.js"></script>
</body>
</html>
